{% extends 'base.html' %}
{% block content %}
<h2>Lista de Estudiantes</h2>

<a href="{{ url_for('nuevo_estudiante') }}">Registrar nuevo estudiante</a>

<table border="1" cellpadding="5" cellspacing="0">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        {% for estudiante in estudiantes %}
        <tr>
            <td>{{ estudiante.id }}</td>
            <td>{{ estudiante.nombre }}</td>
            <td>{{ estudiante.email }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">No hay estudiantes registrados</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
